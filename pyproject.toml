[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xai-bench"
version = "0.1.0"
description = "XAI faithfulness benchmark on audio detectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "tensorboard>=2.18.0",
    "huggingface-hub>=0.26.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xai_bench"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
